<div id="page-article" class="page">

  <!-- Hero con imagen de fondo e info encima -->
  <div class="article-hero">
    <img id="artHeroImg" src="" alt="" class="article-hero-img" />
    <div class="article-hero-overlay"></div>

    <!-- Botón volver flotante -->
    <button class="article-back-btn" onclick="goPage('blog')">
      <i class="fas fa-arrow-left"></i> Volver al Blog
    </button>

    <!-- Info del artículo sobre la imagen -->
    <div class="article-hero-info">
      <div class="article-hero-meta">
        <span class="article-hero-cat" id="artHeroCat"></span>
        <span class="article-hero-date"><i class="fas fa-calendar-alt"></i> <span id="artDate"></span></span>
        <span class="article-hero-read"><i class="fas fa-clock"></i> <span id="artReadTime"></span></span>
      </div>
      <h1 class="article-hero-title" id="artTitle"></h1>
      <div class="article-hero-author">
        <div class="article-hero-av" id="artAuthorAv"></div>
        <span class="article-hero-author-name" id="artAuthorName"></span>
      </div>
    </div>
  </div>

  <!-- Cuerpo del artículo -->
  <div class="article-body-wrap">
    <!-- meta-bar oculta, la info está en el hero -->
    <div class="article-meta-bar">
      <span class="blog-cat-label" id="artCatLabel"></span>
    </div>

    <div class="article-content" id="artBody"></div>

    <div class="article-footer-actions">
      <button class="legal-action-btn legal-action-btn-primary" onclick="goPage('blog')">
        <i class="fas fa-arrow-left"></i> Volver al Blog
      </button>
      <button class="legal-action-btn" onclick="goPage('directory')">
        <i class="fas fa-store"></i> Ver negocios
      </button>
    </div>
  </div>

  <!-- Sección de comentarios -->
  <div class="article-comments-section">
    <button class="article-comments-toggle" id="artCommentsToggle" onclick="toggleArticleComments()">
      <span>Comentarios</span>
      <span class="article-comments-count-badge" id="artCommentCount">0</span>
      <i class="fas fa-chevron-down article-comments-chevron" id="artCommentsChevron"></i>
    </button>

    <div class="article-comments-body" id="artCommentsBody" style="display:none">
      <!-- Formulario -->
      <div class="article-comment-form">
        <h3><i class="fas fa-comment-dots" style="color:var(--primary);margin-right:8px"></i>Deja tu comentario</h3>
        <textarea id="artCommentText" placeholder="¿Qué piensas sobre este artículo?" maxlength="500" oninput="artCommentCharCount(this)"></textarea>
        <div class="article-comment-form-footer">
          <span class="article-comment-chars" id="artCommentChars">0 / 500</span>
          <button class="article-comment-submit" onclick="submitArticleComment()">
            <i class="fas fa-paper-plane"></i> Comentar
          </button>
        </div>
      </div>

      <!-- Lista de comentarios -->
      <div class="article-comment-list-wrap" id="artCommentListWrap">
        <div class="article-comment-list" id="artCommentList"></div>
      </div>
    </div>
  </div>

</div>
