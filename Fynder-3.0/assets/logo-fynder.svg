<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">

  <!-- Pin de ubicación teal -->
  <g transform="translate(10, 4)">
    <!-- Cuerpo del pin / gota -->
    <path d="M62 0 C28 0 0 28 0 62 C0 96 62 144 62 144 C62 144 124 96 124 62 C124 28 96 0 62 0 Z" fill="#4DBFBA"/>

    <!-- Lupa: aro amarillo grueso -->
    <circle cx="60" cy="58" r="26" fill="none" stroke="#F5C11C" stroke-width="13"/>
    <!-- Lupa: interior negro/oscuro -->
    <circle cx="60" cy="58" r="13" fill="#1a1a1a"/>
    <!-- Lupa: interior blanco pequeño (reflejo) -->
    <circle cx="60" cy="58" r="9" fill="none" stroke="#1a1a1a" stroke-width="0"/>
    <!-- Mango de la lupa amarillo, sale abajo-derecha, grueso y redondeado -->
    <line x1="79" y1="77" x2="98" y2="96" stroke="#F5C11C" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- Texto FYNDER en teal oscuro -->
  <text x="155" y="106"
        font-family="'Montserrat','Arial Black','Impact',sans-serif"
        font-size="78"
        font-weight="900"
        fill="#1C8A85"
        letter-spacing="-1">FYNDER</text>
</svg>
