<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">

  <!-- ══ ÍCONO ══ -->
  <g transform="translate(5, 5)">

    <!-- Sombra del mango (para que se vea encima del pin) -->
    <!-- Pin Google Maps — forma de gota redondeada -->
    <path d="M 70 2
             C 33 2 3 32 3 69
             C 3 103 70 152 70 152
             C 70 152 137 103 137 69
             C 137 32 107 2 70 2 Z"
          fill="#45C6C0"/>

    <!-- Aro exterior de la lupa: amarillo, grueso, centrado a la izq-superior del pin -->
    <circle cx="63" cy="63" r="32"
            fill="none"
            stroke="#F9C200"
            stroke-width="14"/>

    <!-- Mango de la lupa: amarillo, grueso, sale del aro hacia abajo-derecha, sobresale del pin -->
    <line x1="87" y1="87" x2="118" y2="118"
          stroke="#F9C200"
          stroke-width="15"
          stroke-linecap="round"/>

  </g>

  <!-- ══ TEXTO ══ -->
  <!-- FYN en blanco, DER en teal oscuro -->
  <text
    x="162" y="107"
    font-family="'Montserrat','Arial Black','Arial',sans-serif"
    font-size="74"
    font-weight="900"
    letter-spacing="0">
    <tspan fill="white">FYN</tspan><tspan fill="#1A8C87">DER</tspan>
  </text>

</svg>
