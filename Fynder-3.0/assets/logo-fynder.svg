<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
  <defs>
    <mask id="pinCut">
      <rect width="520" height="160" fill="white"/>

      <!-- Quitar zona completa de la lupa + gap -->
      <circle cx="73" cy="68" r="44" fill="black"/>

      <!-- Devolver exactamente donde va el trazo del aro -->
      <!-- aro centro r=27, stroke=13 → exterior r=33.5, interior r=20.5 -->
      <circle cx="73" cy="68" r="33" fill="white"/>
      <circle cx="73" cy="68" r="21" fill="black"/>

      <!-- Quitar zona del mango + gap alrededor -->
      <line x1="87" y1="82" x2="132" y2="127"
            stroke="black" stroke-width="28" stroke-linecap="round"/>
      <!-- Devolver solo el trazo exacto del mango -->
      <line x1="91" y1="86" x2="124" y2="119"
            stroke="white" stroke-width="13" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Pin teal -->
  <path d="M 75 6 C 40 6 11 35 11 70 C 11 103 75 155 75 155
           C 75 155 139 103 139 70 C 139 35 110 6 75 6 Z"
        fill="#45C6C0" mask="url(#pinCut)"/>

  <!-- Aro amarillo exacto -->
  <circle cx="73" cy="68" r="27" fill="none" stroke="#F9C200" stroke-width="13"/>

  <!-- Mango amarillo -->
  <line x1="91" y1="86" x2="124" y2="119"
        stroke="#F9C200" stroke-width="13" stroke-linecap="round"/>

  <!-- TEXTO -->
  <text x="158" y="107"
        font-family="'Montserrat','Arial Black','Arial',sans-serif"
        font-size="74" font-weight="900" letter-spacing="0">
    <tspan fill="white">FYN</tspan><tspan fill="#1A8C87">DER</tspan>
  </text>
</svg>
