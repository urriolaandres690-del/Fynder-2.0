    C 40 8 13 35 13 69
    C 13 88 22 105 36 116
    C 48 126 74 158 74 158
    C 74 158 100 126 112 116
    C 126 105 135 88 135 69
    C 135 35 108 8 74 8 Z
  "/>

  <!-- Lupa amarilla con fill puro, sin stroke -->
