<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">

  <!-- ── ÍCONO: PIN + LUPA ── -->
  <g transform="translate(10, 5)">

    <!-- Cuerpo del pin (forma de gota redondeada) -->
    <path d="
      M 68 0
      C 30 0 0 30 0 68
      C 0 100 68 148 68 148
      C 68 148 136 100 136 68
      C 136 30 106 0 68 0 Z
    " fill="#4EC9C4" />

    <!-- Anillo blanco (hueco interior del pin) -->
    <circle cx="68" cy="64" r="42" fill="white"/>

    <!-- Anillo teal interior -->
    <circle cx="68" cy="64" r="33" fill="#4EC9C4"/>

    <!-- Círculo interior blanco (hueco de la lupa) -->
    <circle cx="62" cy="57" r="21" fill="white"/>

    <!-- ARO de la lupa: amarillo grueso -->
    <circle cx="62" cy="57" r="21" fill="none" stroke="#F6C90E" stroke-width="11"/>

    <!-- Mango de la lupa: amarillo grueso, diagonal abajo-derecha -->
    <line x1="77" y1="72" x2="98" y2="93"
          stroke="#F6C90E" stroke-width="13"
          stroke-linecap="round"/>

  </g>

  <!-- ── TEXTO FYNDER ── -->
  <text
    x="168" y="112"
    font-family="'Montserrat','Arial Black',sans-serif"
    font-size="76"
    font-weight="900"
    fill="#1C8A85"
    letter-spacing="-1">FYNDER</text>

</svg>
