<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">

  <!-- Pin de ubicación teal (izquierda) -->
  <g transform="translate(14, 6)">
    <!-- Cuerpo del pin / gota -->
    <path d="M58 0 C26 0 0 26 0 58 C0 90 58 138 58 138 C58 138 116 90 116 58 C116 26 90 0 58 0 Z" fill="#4DBFBA"/>
    <!-- Anillo blanco -->
    <circle cx="58" cy="56" r="32" fill="white"/>
    <!-- Relleno teal central -->
    <circle cx="58" cy="56" r="26" fill="#4DBFBA"/>
    <!-- Lupa: aro amarillo -->
    <circle cx="54" cy="52" r="14" fill="none" stroke="#F5C11C" stroke-width="7.5"/>
    <!-- Lupa: mango amarillo -->
    <line x1="64" y1="63" x2="77" y2="76" stroke="#F5C11C" stroke-width="7.5" stroke-linecap="round"/>
  </g>

  <!-- Texto FYNDER todo en teal oscuro, visible sobre cualquier fondo -->
  <text x="152" y="106"
        font-family="'Montserrat','Arial Black','Impact',sans-serif"
        font-size="78"
        font-weight="900"
        fill="#1C8A85"
        letter-spacing="-1">FYNDER</text>
</svg>
