<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <!-- Pin de ubicación teal -->
  <g transform="translate(18, 8)">
    <!-- Sombra suave -->
    <!-- Cuerpo del pin (forma de gota) -->
    <path d="M62 0 C28 0 0 28 0 62 C0 96 62 148 62 148 C62 148 124 96 124 62 C124 28 96 0 62 0 Z" fill="#4EC9C5"/>
    <!-- Anillo blanco interior -->
    <circle cx="62" cy="60" r="34" fill="white"/>
    <!-- Anillo teal interior -->
    <circle cx="62" cy="60" r="28" fill="#4EC9C5"/>
    <!-- Círculo central blanco de la lupa -->
    <circle cx="58" cy="56" r="16" fill="none" stroke="#F5C11C" stroke-width="8"/>
    <!-- Mango de la lupa -->
    <line x1="69" y1="68" x2="82" y2="81" stroke="#F5C11C" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Texto FYNDER en teal oscuro -->
  <text x="162" y="112" 
        font-family="'Montserrat','Poppins','Arial Black',sans-serif" 
        font-size="82" 
        font-weight="800" 
        fill="#2A9D98"
        letter-spacing="-1">FYNDER</text>
</svg>
