<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150">

  <!-- ── ÍCONO PIN + LUPA ── -->
  <g transform="translate(8, 5)">

    <!-- Cuerpo del pin teal (sin anillo blanco exterior) -->
    <path d="M 66 0 C 30 0 2 28 2 64 C 2 94 66 140 66 140 C 66 140 130 94 130 64 C 130 28 102 0 66 0 Z" fill="#4EC9C4"/>

    <!-- Círculo interior oscuro (fondo del ícono de lupa) -->
    <circle cx="66" cy="60" r="40" fill="#1a1a2e"/>

    <!-- Lupa: aro amarillo grueso -->
    <circle cx="60" cy="53" r="20"
            fill="none"
            stroke="#F6C700"
            stroke-width="11"/>

    <!-- Lupa: mango amarillo diagonal, grueso -->
    <line x1="74" y1="68" x2="95" y2="90"
          stroke="#F6C700"
          stroke-width="11"
          stroke-linecap="round"/>

  </g>

  <!-- ── TEXTO: FYN blanco · DER teal ── -->
  <text
    x="150" y="102"
    font-family="'Montserrat','Arial Black','Arial',sans-serif"
    font-size="70"
    font-weight="900"
    letter-spacing="1">
    <tspan fill="white">FYN</tspan><tspan fill="#1C8A85">DER</tspan>
  </text>

</svg>
