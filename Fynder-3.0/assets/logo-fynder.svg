<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 165">

  <!-- ── ÍCONO PIN + LUPA ── -->
  <g transform="translate(8, 5)">

    <!-- Cuerpo del pin teal (gota redondeada) -->
    <path d="
      M 90 6
      C 48 6  8 46  8 88
      C  8 124 90 194 90 194
      C 90 194 172 124 172 88
      C 172 46 132  6  90  6 Z
    " fill="#4EC9C4"/>

    <!-- Anillo blanco interior del pin -->
    <circle cx="90" cy="83" r="50" fill="white"/>

    <!-- Relleno teal dentro del anillo (el "donut" teal) -->
    <circle cx="90" cy="83" r="40" fill="#4EC9C4"/>

    <!-- ── LUPA amarilla, desplazada arriba-izquierda, mango sale del pin ── -->

    <!-- Aro amarillo grueso de la lupa -->
    <circle cx="80" cy="72" r="28"
            fill="none"
            stroke="#F6C700"
            stroke-width="13"/>

    <!-- Interior blanco de la lupa (hueco) -->
    <circle cx="80" cy="72" r="21" fill="white"/>

    <!-- Mango: nace en el borde inferior-derecho del aro y sale atravesando el pin -->
    <line x1="101" y1="93" x2="130" y2="122"
          stroke="#F6C700"
          stroke-width="14"
          stroke-linecap="round"/>

  </g>

  <!-- ── TEXTO: FYN blanco · DER teal ── -->
  <text
    x="196" y="122"
    font-family="'Montserrat','Arial Black','Arial',sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="1">
    <tspan fill="white">FYN</tspan><tspan fill="#1C8A85">DER</tspan>
  </text>

</svg>
