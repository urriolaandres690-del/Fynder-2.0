<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
  <defs>
    <mask id="pinCut">
      <rect width="520" height="160" fill="white"/>

      <!-- Quitar TODO alrededor + dentro de la lupa (zona grande) -->
      <circle cx="73" cy="68" r="42" fill="black"/>

      <!-- Devolver SOLO donde va el trazo amarillo del aro -->
      <!-- aro r=27, stroke=13 → va de r=20.5 a r=33.5 -->
      <circle cx="73" cy="68" r="34" fill="white"/>
      <circle cx="73" cy="68" r="21" fill="black"/>

      <!-- Quitar el mango + zona alrededor del mango -->
      <line x1="88" y1="83" x2="130" y2="125"
            stroke="black" stroke-width="26" stroke-linecap="round"/>

      <!-- Devolver solo el trazo del mango amarillo -->
      <line x1="91" y1="86" x2="124" y2="119"
            stroke="white" stroke-width="14" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Pin teal con recortes precisos -->
  <path d="M 75 6 C 40 6 11 35 11 70 C 11 103 75 155 75 155
           C 75 155 139 103 139 70 C 139 35 110 6 75 6 Z"
        fill="#45C6C0" mask="url(#pinCut)"/>

  <!-- Aro lupa amarillo -->
  <circle cx="73" cy="68" r="27" fill="none" stroke="#F9C200" stroke-width="13"/>

  <!-- Mango lupa -->
  <line x1="91" y1="86" x2="124" y2="119"
        stroke="#F9C200" stroke-width="14" stroke-linecap="round"/>

  <!-- TEXTO -->
  <text x="158" y="107"
        font-family="'Montserrat','Arial Black','Arial',sans-serif"
        font-size="74" font-weight="900" letter-spacing="0">
    <tspan fill="white">FYN</tspan><tspan fill="#1A8C87">DER</tspan>
  </text>
</svg>
