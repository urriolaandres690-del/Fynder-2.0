<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">

  <!-- ── ÍCONO PIN + LUPA ── -->
  <g transform="translate(8, 4)">

    <!-- Fondo blanco redondeado (como en la imagen original) -->
    <rect x="0" y="0" width="152" height="152" rx="30" fill="white"/>

    <!-- Cuerpo del pin teal -->
    <path d="
      M 76 8
      C 44 8 18 34 18 66
      C 18 92 76 144 76 144
      C 76 144 134 92 134 66
      C 134 34 108 8 76 8 Z
    " fill="#4DC9C4"/>

    <!-- Círculo blanco interior del pin -->
    <circle cx="76" cy="62" r="36" fill="white"/>

    <!-- Cuerpo amarillo de la lupa (aro grueso) -->
    <circle cx="70" cy="56" r="22" fill="none" stroke="#F6C700" stroke-width="12"/>

    <!-- Interior blanco de la lupa -->
    <circle cx="70" cy="56" r="16" fill="white"/>

    <!-- Mango de la lupa amarillo grueso -->
    <line x1="86" y1="72" x2="108" y2="94"
          stroke="#F6C700" stroke-width="13"
          stroke-linecap="round"/>

  </g>

  <!-- ── TEXTO FYNDER ── -->
  <text
    x="178" y="112"
    font-family="'Montserrat','Arial Black','Arial',sans-serif"
    font-size="74"
    font-weight="900"
    fill="#1C8A85"
    letter-spacing="-1">FYNDER</text>

</svg>
