<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150">

  <!-- ── ÍCONO: PIN GOOGLE + LUPA ── -->
  <g transform="translate(6, 4)">

    <!-- Pin estilo Google Maps (gota teal, sin anillo blanco interior) -->
    <path d="
      M 68 0
      C 32 0 4 28 4 64
      C 4 96 68 148 68 148
      C 68 148 132 96 132 64
      C 132 28 104 0 68 0 Z
    " fill="#4EC9C4"/>

    <!-- Lupa amarilla GRANDE encima del pin -->
    <!-- Aro amarillo grueso -->
    <circle cx="62" cy="58" r="28"
            fill="none"
            stroke="#F6C700"
            stroke-width="13"/>

    <!-- Mango de la lupa amarillo, diagonal abajo-derecha, largo -->
    <line x1="82" y1="78" x2="110" y2="106"
          stroke="#F6C700"
          stroke-width="14"
          stroke-linecap="round"/>

  </g>

  <!-- ── TEXTO: FYN blanco · DER teal ── -->
  <text
    x="158" y="103"
    font-family="'Montserrat','Arial Black','Arial',sans-serif"
    font-size="70"
    font-weight="900"
    letter-spacing="1">
    <tspan fill="white">FYN</tspan><tspan fill="#1C8A85">DER</tspan>
  </text>

</svg>
