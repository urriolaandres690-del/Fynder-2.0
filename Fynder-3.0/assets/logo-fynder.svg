<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
  <defs>
    <!--
      Máscara del pin:
      blanco = se pinta el teal
      negro  = transparente (se ve el fondo)

      Recortamos:
        1. El interior del aro de la lupa (círculo pequeño)
        2. El área fuera del aro pero donde el pin no debería verse
           por el hueco exterior (no aplica, la lupa solo corta el interior)
        3. El mango donde cruza el pin
    -->
    <mask id="m">
      <!-- Todo blanco: pin entero visible por defecto -->
      <path d="M 70 2 C 33 2 3 32 3 69 C 3 103 70 152 70 152
               C 70 152 137 103 137 69 C 137 32 107 2 70 2 Z"
            fill="white"/>
      <!-- Negro: interior del aro (debe quedar transparente) -->
      <circle cx="68" cy="66" r="17" fill="black"/>
      <!-- Negro: mango de la lupa que cruza el pin -->
      <line x1="90" y1="88" x2="122" y2="120"
            stroke="black" stroke-width="16" stroke-linecap="round"/>
    </mask>
  </defs>

  <g transform="translate(5, 4)">
    <!-- Pin teal con hueco en el interior de la lupa y en el mango -->
    <path d="M 70 2 C 33 2 3 32 3 69 C 3 103 70 152 70 152
             C 70 152 137 103 137 69 C 137 32 107 2 70 2 Z"
          fill="#45C6C0"
          mask="url(#m)"/>

    <!-- Aro amarillo de la lupa encima -->
    <circle cx="68" cy="66" r="28"
            fill="none"
            stroke="#F9C200"
            stroke-width="13"/>

    <!-- Mango amarillo de la lupa -->
    <line x1="90" y1="88" x2="120" y2="118"
          stroke="#F9C200"
          stroke-width="14"
          stroke-linecap="round"/>
  </g>

  <!-- TEXTO: FYN blanco · DER teal -->
  <text x="162" y="107"
        font-family="'Montserrat','Arial Black','Arial',sans-serif"
        font-size="74" font-weight="900" letter-spacing="0">
    <tspan fill="white">FYN</tspan><tspan fill="#1A8C87">DER</tspan>
  </text>
</svg>
